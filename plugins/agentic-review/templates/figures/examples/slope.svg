<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340">
<title>Slope chart: a custom figure</title>
<circle cx="8" cy="10" r="3.7" class="fill-surface line-muted" stroke-width="1.7"/>
<text x="17" y="13" class="fill-ink2" font-size="8.5">headline gain</text>
<circle cx="110" cy="10" r="4.1" class="fill-1 line-surface" stroke-width="1.6"/>
<text x="119" y="13" class="fill-ink2" font-size="8.5">the same paper's stricter comparison</text>
<text x="290" y="44" text-anchor="middle" font-weight="600">Headline</text>
<text x="500" y="44" text-anchor="middle" font-weight="600">Stricter comparison</text>
<line x1="72" y1="300.0" x2="560" y2="300.0" class="line-axis" stroke-width="0.7" data-ytick="0"/>
<text x="64" y="303.0" text-anchor="end" class="fill-ink2" font-size="8.5" data-ytick="0">0</text>
<line x1="72" y1="252.0" x2="560" y2="252.0" class="line-grid" stroke-width="0.7" data-ytick="1"/>
<text x="64" y="255.0" text-anchor="end" class="fill-ink2" font-size="8.5" data-ytick="1">+1</text>
<line x1="72" y1="204.0" x2="560" y2="204.0" class="line-grid" stroke-width="0.7" data-ytick="2"/>
<text x="64" y="207.0" text-anchor="end" class="fill-ink2" font-size="8.5" data-ytick="2">+2</text>
<line x1="72" y1="156.0" x2="560" y2="156.0" class="line-grid" stroke-width="0.7" data-ytick="3"/>
<text x="64" y="159.0" text-anchor="end" class="fill-ink2" font-size="8.5" data-ytick="3">+3</text>
<line x1="72" y1="108.0" x2="560" y2="108.0" class="line-grid" stroke-width="0.7" data-ytick="4"/>
<text x="64" y="111.0" text-anchor="end" class="fill-ink2" font-size="8.5" data-ytick="4">+4</text>
<line x1="72" y1="60.0" x2="560" y2="60.0" class="line-grid" stroke-width="0.7" data-ytick="5"/>
<text x="64" y="63.0" text-anchor="end" class="fill-ink2" font-size="8.5" data-ytick="5">+5</text>
<text x="30" y="180.0" text-anchor="middle" class="fill-muted" font-size="8.5" transform="rotate(-90 30 180.0)">PSNR gain (dB)</text>
<g data-key="sriram2020grappanet" data-label="Sriram et al., 2020b">
<line x1="290" y1="64.8" x2="500" y2="244.3" class="line-axis" stroke-width="1.4" data-y1="4.9" data-y2="1.16"/>
<circle cx="290" cy="64.8" r="3.7" class="dot fill-surface line-muted" stroke-width="1.7" data-y="4.9" data-series="headline"/>
<circle cx="500" cy="244.3" r="4.1" class="dot fill-1 line-surface" stroke-width="1.6" data-y="1.16" data-series="stricter"/>
<text x="280" y="67.8" text-anchor="end" class="fill-ink" font-size="8.5" font-weight="600">Sriram et al., 2020b  +4.9</text>
<text x="510" y="247.3" class="fill-ink2" font-size="8.5">+1.16</text>
</g>
<g data-key="chen2024accelerated" data-label="Chen et al., 2024a">
<line x1="290" y1="148.3" x2="500" y2="285.6" class="line-axis" stroke-width="1.4" data-y1="3.16" data-y2="0.3"/>
<circle cx="290" cy="148.3" r="3.7" class="dot fill-surface line-muted" stroke-width="1.7" data-y="3.16" data-series="headline"/>
<circle cx="500" cy="285.6" r="4.1" class="dot fill-1 line-surface" stroke-width="1.6" data-y="0.3" data-series="stricter"/>
<text x="280" y="151.3" text-anchor="end" class="fill-ink" font-size="8.5" font-weight="600">Chen et al., 2024a  +3.16</text>
<text x="510" y="288.6" class="fill-ink2" font-size="8.5">+0.3</text>
</g>
<g data-key="eo2018kiki" data-label="Eo et al., 2018a">
<line x1="290" y1="190.1" x2="500" y2="207.8" class="line-axis" stroke-width="1.4" data-y1="2.29" data-y2="1.92"/>
<circle cx="290" cy="190.1" r="3.7" class="dot fill-surface line-muted" stroke-width="1.7" data-y="2.29" data-series="headline"/>
<circle cx="500" cy="207.8" r="4.1" class="dot fill-1 line-surface" stroke-width="1.6" data-y="1.92" data-series="stricter"/>
<text x="280" y="193.1" text-anchor="end" class="fill-ink" font-size="8.5" font-weight="600">Eo et al., 2018a  +2.29</text>
<text x="510" y="210.8" class="fill-ink2" font-size="8.5">+1.92</text>
</g>
</svg>
